# ML Training & Fine-Tuning Hyperparameters Configuration

global_training:
  seed: 42
  deterministic: true
  logging_dir: "logs/training"
  checkpoint_dir: "checkpoints"
  mlflow_tracking_uri: "http://localhost:5000"
  experiment_name: "medicine_ai_multitask_training"

pipelines:
  # 1. OCR & Document Layout Fine-Tuning
  ocr_document_tuning:
    backbone: "microsoft/trocr-base-stage1"
    dataset_name: "indian_medical_prescription_ocr"
    batch_size: 8
    gradient_accumulation_steps: 4
    learning_rate: 5.0e-5
    weight_decay: 0.01
    epochs: 25
    warmup_ratio: 0.1
    mixed_precision: "fp16"
    early_stopping_patience: 4
    evaluation_strategy: "epoch"
    save_total_limit: 3
    metric_for_best_model: "eval_cer"
    greater_is_better: false

  # 2. Handwritten Medicine Recognition (CRNN / TrOCR)
  handwriting_recognition_training:
    dataset_name: "doctors_handwritten_prescription_bd"
    image_height: 128
    image_width: 384
    batch_size: 32
    learning_rate: 3.0e-4
    epochs: 50
    optimizer: "AdamW"
    lr_scheduler: "cosine"
    early_stopping_patience: 5
    metric_for_best_model: "eval_top1_accuracy"
    greater_is_better: true

  # 3. Medical Named Entity Recognition (Token Classification)
  medical_ner_training:
    backbone: "emilyalsentzer/Bio_ClinicalBERT"
    batch_size: 16
    learning_rate: 2.0e-5
    epochs: 15
    warmup_steps: 500
    weight_decay: 0.01
    metric_for_best_model: "eval_macro_f1"
    greater_is_better: true

  # 4. Clinical Intent Classifier Training
  intent_classifier_training:
    backbone: "michiyasunaga/BioLinkBERT-base"
    batch_size: 32
    learning_rate: 2.0e-5
    epochs: 12
    dropout: 0.2
    metric_for_best_model: "eval_macro_f1"
    greater_is_better: true

  # 5. Medical Safety & Emergency Triage Training
  safety_classifier_training:
    backbone: "emilyalsentzer/Bio_ClinicalBERT"
    batch_size: 32
    learning_rate: 1.5e-5
    epochs: 20
    class_weights:
      EMERGENCY: 5.0 # Penalize False Negatives on emergencies heavily
      HIGH: 3.0
      MODERATE: 1.5
      LOW: 1.0
      OUT_OF_SCOPE: 1.0
    metric_for_best_model: "eval_emergency_recall"
    greater_is_better: true

  # 6. Open LLM Instruction Fine-Tuning (QLoRA / PEFT)
  llm_qlora_tuning:
    base_model: "meta-llama/Meta-Llama-3-8B-Instruct"
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules:
      - "q_proj"
      - "k_proj"
      - "v_proj"
      - "o_proj"
      - "gate_proj"
      - "up_proj"
      - "down_proj"
    bits: 4
    double_quant: true
    quant_type: "nf4"
    batch_size: 2
    gradient_accumulation_steps: 8
    learning_rate: 1.0e-4
    max_seq_length: 2048
    epochs: 3
    warmup_ratio: 0.03
    optim: "paged_adamw_8bit"
